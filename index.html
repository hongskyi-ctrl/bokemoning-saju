
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복오는아침 | 무료 사주풀이</title>
  <style>
    body {
      margin: 0;
      background: #fff9ef;
      font-family: "Malgun Gothic", sans-serif;
      color: #44382c;
      text-align: center;
    }
    header {
      padding: 55px 20px 30px;
      background: linear-gradient(#f7e8bd, #fff9ef);
    }
    h1 {
      font-size: 36px;
      color: #986b24;
    }
    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 5px 20px #00000010;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      background: #ad843d;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>☀️ 복오는아침</h1>
    <p>당신의 사주에 담긴 이야기를 만나보세요.</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>나의 무료 사주풀이</h2>
      <p>태어난 날을 입력해 주세요.</p>

      <label for="birth">생년월일</label>
      <input type="date" id="birth">

      <label for="calendar">양력 / 음력</label>
      <select id="calendar">
        <option value="solar">양력</option>
        <option value="lunar">음력</option>
      </select>

      <label for="birthtime">태어난 시간</label>
      <select id="birthtime">
        <option>모름</option>
        <option>자시 (23~01시)</option>
        <option>축시 (01~03시)</option>
        <option>인시 (03~05시)</option>
        <option>묘시 (05~07시)</option>
        <option>진시 (07~09시)</option>
        <option>사시 (09~11시)</option>
        <option>오시 (11~13시)</option>
        <option>미시 (13~15시)</option>
        <option>신시 (15~17시)</option>
        <option>유시 (17~19시)</option>
        <option>술시 (19~21시)</option>
        <option>해시 (21~23시)</option>
      </select>

      <button onclick="alert('사주 계산 기능은 다음 단계에서 연결합니다.')">
        내 사주 무료로 보기
      </button>
    </div>
    <p>전통 명리학을 바탕으로 한 재미와 참고용 서비스입니다.</p>
  </main>
</body>
</html>
